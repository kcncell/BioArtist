# Windows packaging — output: release/win/
# On macOS/Linux: produces portable .exe; full NSIS Setup is more reliable on Windows.
appId: com.bioartist.app
productName: BioArtist
copyright: Copyright © BioArtist contributors
directories:
  output: release/win
  buildResources: electron/resources
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!**/*.{map,md}"
  - "!mcp-server/**"
  - "!scripts/**"
  - "!docs/**"
  - "!release/**"
asar: true
asarUnpack:
  - dist/rdkit/**
  - dist/**/*.wasm
# Avoid Wine rcedit timeouts when cross-building from macOS
forceCodeSigning: false
win:
  # Skip version-resource editing via Wine (common cross-build failure on Mac)
  signAndEditExecutable: false
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  artifactName: BioArtist-${version}-win-${arch}.${ext}
portable:
  artifactName: BioArtist-${version}-win-${arch}-portable.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BioArtist
  runAfterFinish: true
  artifactName: BioArtist-${version}-win-${arch}-Setup.exe
