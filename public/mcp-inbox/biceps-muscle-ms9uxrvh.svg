<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" fill="none">
  <title>Human biceps brachii (flexed arm)</title>
  <!-- subtle arm silhouette -->
  <path d="M48 18
           C40 28, 36 42, 38 58
           C40 78, 42 96, 40 112
           C38 128, 34 140, 28 150
           L42 152
           C48 140, 52 128, 54 112
           C56 96, 58 78, 56 58
           C54 42, 52 28, 58 18
           Z"
        fill="#fce7f3" stroke="#9d174d" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- deltoid / shoulder mass (upper) -->
  <ellipse cx="52" cy="32" rx="18" ry="14"
           fill="#f9a8d4" stroke="#9d174d" stroke-width="1.3"/>
  <path d="M38 28 C44 22, 58 20, 66 28" stroke="#be185d" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- biceps brachii belly (main muscle) — clear bulge -->
  <ellipse cx="50" cy="72" rx="16" ry="28"
           fill="#db2777" stroke="#9d174d" stroke-width="1.8"/>
  <!-- long head ridge -->
  <path d="M44 52 C42 64, 42 80, 45 96"
        stroke="#9d174d" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.85"/>
  <!-- short head ridge -->
  <path d="M56 52 C58 64, 58 80, 55 96"
        stroke="#be185d" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- highlight for volume -->
  <ellipse cx="46" cy="68" rx="5" ry="12" fill="#fda4af" opacity="0.55"/>

  <!-- distal tendon to elbow -->
  <path d="M46 98 L48 112 L52 112 L54 98"
        fill="#fbcfe8" stroke="#9d174d" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M48 112 C46 118, 46 124, 48 128"
        stroke="#9d174d" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- brachialis under biceps (side strip) -->
  <path d="M62 58 C68 70, 68 88, 62 100 C58 92, 58 72, 62 58 Z"
        fill="#e11d48" opacity="0.75" stroke="#9f1239" stroke-width="1.1"/>

  <!-- elbow joint cue -->
  <circle cx="50" cy="118" r="5.5" fill="#fce7f3" stroke="#9d174d" stroke-width="1.4"/>
  <circle cx="50" cy="118" r="2" fill="#db2777"/>

  <!-- forearm start -->
  <path d="M44 124
           C40 134, 36 144, 32 152
           L46 154
           C50 144, 54 134, 56 124
           Z"
        fill="#fbcfe8" stroke="#9d174d" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- labels (clear educational labels) -->
  <g font-family="system-ui, -apple-system, sans-serif" fill="#831843">
    <text x="78" y="36" font-size="8" font-weight="600">Deltoid</text>
    <line x1="68" y1="32" x2="76" y2="34" stroke="#9d174d" stroke-width="1"/>
    <text x="78" y="74" font-size="9" font-weight="700">Biceps</text>
    <text x="78" y="84" font-size="8" font-weight="600">brachii</text>
    <line x1="64" y1="72" x2="76" y2="74" stroke="#9d174d" stroke-width="1"/>
    <text x="78" y="108" font-size="7.5" font-weight="600">Tendon</text>
    <line x1="54" y1="106" x2="76" y2="106" stroke="#9d174d" stroke-width="1"/>
    <text x="8" y="82" font-size="7" font-weight="600" text-anchor="start">Brachialis</text>
    <line x1="34" y1="78" x2="62" y2="78" stroke="#9f1239" stroke-width="0.9" stroke-dasharray="2 1.5"/>
  </g>
</svg>
